<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domácí doučovatel · Přímý chat</title>
  <link rel="stylesheet" href="./chat.css">
  <script src="./chat.js" defer></script>
</head>
<body>
  <main>
    <header><h1>Domácí doučovatel</h1><span id="stars" role="status" hidden></span><button type="button" id="reset" hidden>Nový chat</button></header>
    <section id="conversation" aria-label="Konverzace">
      <div class="welcome" id="welcome">
        <svg class="welcome-art" aria-hidden="true" viewBox="0 0 124 92">
          <path d="M15 19c15-5 32-3 47 6 15-9 32-11 47-6v55c-15-5-32-2-47 6-15-8-32-11-47-6z" fill="#dcf1df" stroke="#215d4d" stroke-width="3" stroke-linejoin="round"/>
          <path d="M62 25v55M25 37c9-2 18 0 27 4m-27 8c9-2 18 0 27 4m20-12c9-4 18-6 27-4m-27 16c9-4 18-6 27-4" fill="none" stroke="#215d4d" stroke-width="3" stroke-linecap="round"/>
          <path d="m106 0 4 8 8 4-8 4-4 8-4-8-8-4 8-4z" fill="#e5ad3c"/>
        </svg>
        <h2>S čím ti mám pomoct?</h2>
        <p>Napiš otázku, přidej fotku nebo mi řekni, čemu nerozumíš.</p>
      </div>
      <div id="messages" role="log" aria-label="Zprávy"></div>
    </section>
    <form id="compose">
      <p id="availability" role="status"></p>
      <div id="attachment" hidden>
        <img id="preview" alt="Přiložená fotka">
        <button type="button" id="remove">Odebrat fotku</button>
      </div>
      <label class="sr-only" for="question">Napiš otázku</label>
      <div class="quiz-tools" id="quiz-tools" hidden>
        <button type="button" id="quiz">Zkusit kvíz</button>
        <button type="button" id="skip-quiz" hidden>Ukončit kvíz</button>
      </div>
      <textarea id="question" rows="2" maxlength="3000" placeholder="Napiš otázku…"></textarea>
      <div class="actions">
        <input type="file" id="photo" accept="image/*" hidden>
        <button type="button" id="camera"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6l2-2h4l2 2h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="3"/></svg> Fotka</button>
        <button aria-pressed="false" type="button" id="mic"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-4 0h8"/></svg> <span id="mic-label">Mluvit</span></button>
        <button id="send" type="submit">Odeslat <span aria-hidden="true">↑</span></button>
      </div>
      <p id="feedback" role="status"></p>
      <p class="privacy">Odpovídá AI. Fotky posílej bez jmen a obličejů.</p>
    </form>
  </main>
</body>
</html>
