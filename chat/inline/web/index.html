<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Domácí doučovatel · Přímý chat</title>
  <link rel="stylesheet" href="./chat.css">
  <script src="./chat.js" defer></script>
</head>
<body>
  <main>
    <header><h1>Domácí doučovatel</h1><button type="button" id="reset" hidden>Nový chat</button></header>
    <section id="conversation" aria-label="Konverzace">
      <div class="welcome" id="welcome">
        <h2>S čím ti mám pomoct?</h2>
        <p>Napiš otázku, přidej fotku příkladu nebo nadiktuj, kde ses zasekl/a.</p>
        <button type="button" id="example">Co je Coulombův zákon?</button>
      </div>
      <div id="messages" role="log" aria-label="Zprávy"></div>
    </section>
    <form id="compose">
      <details id="access">
        <summary>Přístup do rodinného chatu</summary>
        <label for="code">Rodinný kód</label>
        <input id="code" type="password" autocomplete="off" maxlength="128" placeholder="Kód od rodiče">
      </details>
      <p id="availability" role="status"></p>
      <div id="attachment" hidden>
        <img id="preview" alt="Přiložená fotka">
        <button type="button" id="remove">Odebrat fotku</button>
      </div>
      <label class="sr-only" for="question">Napiš otázku</label>
      <textarea id="question" rows="2" maxlength="3000" placeholder="S čím ti můžu pomoct?"></textarea>
      <div class="actions">
        <input type="file" id="photo" accept="image/*" hidden>
        <button title="Přidat fotku" aria-label="Přidat fotku" type="button" id="camera"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 6l2-2h4l2 2h4a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="3"/></svg></button>
        <button title="Nadiktovat otázku" aria-label="Nadiktovat otázku" aria-pressed="false" type="button" id="mic"><svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-4 0h8"/></svg></button>
        <button id="send" type="submit">Odeslat <span aria-hidden="true">↑</span></button>
      </div>
      <p id="feedback" role="status"></p>
      <p class="privacy">Otázku, fotku nebo nahrávku zpracuje AI na Cloudflare. Přikládej jen učivo bez jmen, obličejů a dalších osobních údajů. AI se může splést.</p>
    </form>
  </main>
</body>
</html>
